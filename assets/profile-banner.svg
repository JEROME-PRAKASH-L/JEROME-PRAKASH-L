<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Jerome Prakash L — Tony Stark-inspired Arc Reactor developer interface</title>
  <desc id="desc">A futuristic dark HUD with a glowing cyan JPL Arc Reactor core, JARVIS status, Mark JPL-26 identity, full power telemetry, and Jerome's AI, automation, and full-stack focus.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020409"/>
      <stop offset="0.48" stop-color="#07111c"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0087a8"/>
      <stop offset="0.48" stop-color="#e9fdff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#c9fbff"/>
      <stop offset="0.46" stop-color="#00e5ff"/>
      <stop offset="0.72" stop-color="#007c9c"/>
      <stop offset="1" stop-color="#02131e"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bdfaff" stop-opacity="0.48"/>
      <stop offset="0.38" stop-color="#00d9ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#0f3140" stroke-width="1" stroke-opacity="0.32"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <g fill="none" stroke="#0b6980" stroke-width="1" opacity="0.38">
      <path d="M0 72H104L134 102H344"/>
      <path d="M0 342H94L132 304H350"/>
      <path d="M1200 65H1104L1072 97H925"/>
      <path d="M1200 356H1118L1082 320H925"/>
      <path d="M422 0V48L450 76V122"/>
      <path d="M840 420V372L812 344V300"/>
    </g>
    <g fill="#00d9ff">
      <circle cx="134" cy="102" r="3"/>
      <circle cx="132" cy="304" r="3"/>
      <circle cx="1072" cy="97" r="3"/>
      <circle cx="1082" cy="320" r="3"/>
      <circle cx="450" cy="76" r="3"/>
      <circle cx="812" cy="344" r="3"/>
    </g>

    <circle cx="228" cy="210" r="194" fill="url(#coreGlow)" filter="url(#wideGlow)">
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(228 210)">
      <circle r="154" fill="#02070d" stroke="#123746" stroke-width="2"/>

      <g>
        <circle r="144" fill="none" stroke="#00d9ff" stroke-width="3" stroke-dasharray="4 12 38 10" opacity="0.8"/>
        <circle cx="0" cy="-144" r="5" fill="#eaffff" filter="url(#glow)"/>
        <circle cx="135" cy="50" r="4" fill="#00d9ff"/>
        <circle cx="-118" cy="82" r="4" fill="#00d9ff"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
      </g>

      <g opacity="0.7">
        <circle r="129" fill="none" stroke="#31ecff" stroke-width="1.5" stroke-dasharray="2 9 19 7"/>
        <path d="M0-136V-121M0 121V136M-136 0H-121M121 0H136M-96-96L-85-85M85 85L96 96M-96 96L-85 85M85-85L96-96" stroke="#b7f9ff" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </g>

      <g fill="#05151e" stroke="#00d9ff" stroke-width="2">
        <path d="M-19-112H19L14-83H-14Z"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(45)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(90)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(135)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(180)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(225)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(270)"/>
        <path d="M-19-112H19L14-83H-14Z" transform="rotate(315)"/>
      </g>

      <circle r="82" fill="#031019" stroke="#83f7ff" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="68" fill="url(#core)" opacity="0.95">
        <animate attributeName="r" values="66;70;66" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="47" fill="#04131d" stroke="#efffff" stroke-width="2"/>

      <path d="M0-34L31 24H-31Z" fill="none" stroke="#c9fbff" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
      <text x="0" y="10" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle" letter-spacing="2">JPL</text>
    </g>

    <g transform="translate(445 70)" font-family="Segoe UI, Arial, sans-serif">
      <g font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">
        <rect width="255" height="30" rx="15" fill="#06212c" stroke="#00d9ff" stroke-opacity="0.7"/>
        <circle cx="18" cy="15" r="5" fill="#5fffea" filter="url(#glow)">
          <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="34" y="20" fill="#9ff8ff">J.A.R.V.I.S. // ONLINE</text>
      </g>

      <text x="0" y="88" fill="#7ca9b8" font-size="15" font-weight="700" letter-spacing="6">MARK JPL-26</text>
      <text x="0" y="143" fill="#f1fdff" font-size="48" font-weight="800" letter-spacing="1">JEROME PRAKASH L</text>
      <rect x="0" y="162" width="616" height="3" rx="1.5" fill="url(#cyanLine)"/>
      <text x="0" y="203" fill="#4beeff" font-size="21" font-weight="700" letter-spacing="1">AI · AUTOMATION · FULL-STACK</text>
      <text x="0" y="238" fill="#a1bdc8" font-size="17">CSE student building intelligent software and real-world systems.</text>

      <g transform="translate(0 273)" font-family="Consolas, monospace" font-size="13">
        <rect width="190" height="54" rx="8" fill="#06141d" stroke="#164758"/>
        <text x="14" y="21" fill="#537d8b">PRIMARY DIRECTIVE</text>
        <text x="14" y="42" fill="#d6fbff">BUILD THE FUTURE</text>

        <g transform="translate(204)">
          <rect width="154" height="54" rx="8" fill="#06141d" stroke="#164758"/>
          <text x="14" y="21" fill="#537d8b">LOCATION</text>
          <text x="14" y="42" fill="#d6fbff">CHENNAI, INDIA</text>
        </g>

        <g transform="translate(372)">
          <rect width="244" height="54" rx="8" fill="#06141d" stroke="#164758"/>
          <text x="14" y="21" fill="#537d8b">MISSION STATUS</text>
          <text x="14" y="42" fill="#5fffea">READY TO COLLABORATE</text>
        </g>
      </g>
    </g>

    <g transform="translate(1068 116)" font-family="Consolas, monospace" text-anchor="middle">
      <circle r="45" fill="none" stroke="#103846" stroke-width="9"/>
      <circle r="45" fill="none" stroke="#00d9ff" stroke-width="9" stroke-linecap="round" stroke-dasharray="283 0" transform="rotate(-90)"/>
      <text y="-2" fill="#dffcff" font-size="17" font-weight="700">100%</text>
      <text y="18" fill="#5d8b9b" font-size="9" letter-spacing="1">POWER</text>
      <text y="76" fill="#4beeff" font-size="11" letter-spacing="2">STABLE</text>
    </g>

  </g>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="24.5" fill="none" stroke="#0a6379" stroke-width="3"/>
</svg>
