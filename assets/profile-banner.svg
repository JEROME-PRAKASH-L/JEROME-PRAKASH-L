<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Jerome Prakash L — Iron Armor and JARVIS hybrid developer HUD</title>
  <desc id="desc">A red-and-gold armor-inspired developer banner fused with a blue holographic JARVIS interface, featuring Jerome Prakash L, Mark JPL-26, AI, automation, full-stack development, and computer vision.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030508"/>
      <stop offset="0.5" stop-color="#090b11"/>
      <stop offset="1" stop-color="#02060a"/>
    </linearGradient>
    <linearGradient id="armorRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0608"/>
      <stop offset="0.45" stop-color="#a41d23"/>
      <stop offset="0.72" stop-color="#5c0b10"/>
      <stop offset="1" stop-color="#210306"/>
    </linearGradient>
    <linearGradient id="armorGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a6"/>
      <stop offset="0.36" stop-color="#f6c453"/>
      <stop offset="0.68" stop-color="#b56d16"/>
      <stop offset="1" stop-color="#6e3508"/>
    </linearGradient>
    <linearGradient id="energyLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b1117"/>
      <stop offset="0.28" stop-color="#f6c453"/>
      <stop offset="0.62" stop-color="#2be7ff"/>
      <stop offset="1" stop-color="#0b6688"/>
    </linearGradient>
    <radialGradient id="arcCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d9fcff"/>
      <stop offset="0.42" stop-color="#35edff"/>
      <stop offset="0.72" stop-color="#087b9d"/>
      <stop offset="1" stop-color="#031018"/>
    </radialGradient>
    <radialGradient id="reactorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33ebff" stop-opacity="0.44"/>
      <stop offset="0.4" stop-color="#159fbd" stop-opacity="0.16"/>
      <stop offset="0.72" stop-color="#9b171d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#123342" stroke-width="1" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="scanLines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1H1200" stroke="#42eaff" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#microGrid)"/>
    <rect width="1200" height="420" fill="url(#scanLines)"/>

    <!-- Metallic armor shell -->
    <path d="M0 0H430L378 62H188L150 100H0Z" fill="url(#armorRed)" opacity="0.92"/>
    <path d="M0 420H462L398 354H212L158 306H0Z" fill="url(#armorRed)" opacity="0.84"/>
    <path d="M1200 0H902L936 52H1082L1126 98H1200Z" fill="url(#armorRed)" opacity="0.88"/>
    <path d="M1200 420H875L920 364H1070L1120 310H1200Z" fill="url(#armorRed)" opacity="0.9"/>
    <path d="M0 102H151L183 70H372" fill="none" stroke="url(#armorGold)" stroke-width="4"/>
    <path d="M0 306H157L210 355H397" fill="none" stroke="url(#armorGold)" stroke-width="4"/>
    <path d="M1200 99H1128L1080 53H937" fill="none" stroke="url(#armorGold)" stroke-width="4"/>
    <path d="M1200 309H1122L1068 364H920" fill="none" stroke="url(#armorGold)" stroke-width="4"/>

    <!-- Blue holographic circuit field -->
    <g fill="none" stroke="#27dff7" stroke-width="1.4" opacity="0.46">
      <path d="M0 138H92L122 168H300"/>
      <path d="M0 278H74L112 240H286"/>
      <path d="M370 0V35L398 63V112"/>
      <path d="M736 0V36L706 66V105"/>
      <path d="M738 420V386L704 352V320"/>
      <path d="M1200 142H1154L1121 175H1085"/>
      <path d="M1200 278H1160L1124 242H1083"/>
    </g>
    <g fill="#45eeff" filter="url(#cyanGlow)">
      <circle cx="122" cy="168" r="3"/>
      <circle cx="112" cy="240" r="3"/>
      <circle cx="398" cy="63" r="3"/>
      <circle cx="706" cy="66" r="3"/>
      <circle cx="704" cy="352" r="3"/>
      <circle cx="1121" cy="175" r="3"/>
      <circle cx="1124" cy="242" r="3"/>
    </g>

    <!-- Left information console -->
    <g transform="translate(64 55)" font-family="Segoe UI, Arial, sans-serif">
      <g font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">
        <path d="M0 0H286L302 16L286 32H0L-16 16Z" fill="#11131a" stroke="#efb83e" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="5" fill="#38edff" filter="url(#cyanGlow)">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <text x="34" y="21" fill="#bafaff">J.A.R.V.I.S. // HYBRID HUD</text>
      </g>

      <text x="0" y="78" fill="#f2c55f" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="6">MARK JPL-26</text>
      <text x="0" y="137" fill="#f7fbff" font-size="50" font-weight="800" letter-spacing="1">JEROME PRAKASH L</text>
      <rect x="0" y="155" width="680" height="4" rx="2" fill="url(#energyLine)"/>

      <text x="0" y="200" fill="#36e8ff" font-size="20" font-weight="700" letter-spacing="1">AI · AUTOMATION · FULL-STACK · VISION</text>
      <text x="0" y="235" fill="#a9bdc6" font-size="17">Engineering intelligent software for practical, real-world missions.</text>

      <g transform="translate(0 270)" font-family="Consolas, monospace" font-size="12">
        <path d="M0 0H197L210 13V58H0Z" fill="#0b1017" stroke="#8f1b20" stroke-width="1.5"/>
        <path d="M0 0H197L210 13" fill="none" stroke="#f0bd4e" stroke-width="2"/>
        <text x="14" y="23" fill="#8fa6af">PRIMARY DIRECTIVE</text>
        <text x="14" y="45" fill="#f8d77f" font-weight="700">BUILD THE FUTURE</text>

        <g transform="translate(224)">
          <path d="M0 0H158L171 13V58H0Z" fill="#08131a" stroke="#14728a" stroke-width="1.5"/>
          <path d="M0 0H158L171 13" fill="none" stroke="#36e8ff" stroke-width="2"/>
          <text x="14" y="23" fill="#7899a6">BASE</text>
          <text x="14" y="45" fill="#d7fbff" font-weight="700">CHENNAI, INDIA</text>
        </g>

        <g transform="translate(409)">
          <path d="M0 0H244L257 13V58H0Z" fill="#0b1017" stroke="#8f1b20" stroke-width="1.5"/>
          <path d="M0 0H244L257 13" fill="none" stroke="url(#energyLine)" stroke-width="2"/>
          <text x="14" y="23" fill="#8fa6af">MISSION STATUS</text>
          <text x="14" y="45" fill="#49f1ff" font-weight="700">READY TO COLLABORATE</text>
        </g>
      </g>

      <g transform="translate(0 352)" font-family="Consolas, monospace" font-size="10" letter-spacing="2">
        <text fill="#874b4f">ARMOR SYSTEM</text>
        <rect x="106" y="-8" width="166" height="8" rx="4" fill="#251014"/>
        <rect x="106" y="-8" width="166" height="8" rx="4" fill="url(#armorGold)"/>
        <text x="286" fill="#f3cc6a">100%</text>
        <text x="361" fill="#3ecfe4">HOLOGRAM LINK</text>
        <rect x="480" y="-8" width="148" height="8" rx="4" fill="#09232c"/>
        <rect x="480" y="-8" width="148" height="8" rx="4" fill="#25dff6"/>
        <text x="642" fill="#65efff">ONLINE</text>
      </g>
    </g>

    <!-- Hybrid Arc Reactor / JARVIS hologram -->
    <g transform="translate(982 210)">
      <circle r="190" fill="url(#reactorAura)" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.42;0.78;0.42" dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle r="170" fill="#05070a" stroke="#2f0609" stroke-width="20"/>
      <circle r="158" fill="none" stroke="url(#armorRed)" stroke-width="14" stroke-dasharray="58 17">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle r="143" fill="none" stroke="#f3c65c" stroke-width="3" stroke-dasharray="5 10 34 9" opacity="0.88">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>

      <!-- Red-gold armor vanes -->
      <g fill="url(#armorGold)" stroke="#8e161c" stroke-width="3" filter="url(#goldGlow)">
        <path d="M-22-142H22L31-112H-31Z"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(45)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(90)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(135)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(180)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(225)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(270)"/>
        <path d="M-22-142H22L31-112H-31Z" transform="rotate(315)"/>
      </g>

      <!-- Blue JARVIS rings -->
      <circle r="107" fill="#040b11" stroke="#36e8ff" stroke-width="3" filter="url(#cyanGlow)"/>
      <circle r="95" fill="none" stroke="#79f6ff" stroke-width="2" stroke-dasharray="2 8 22 7" opacity="0.82">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="82" fill="none" stroke="#178ca8" stroke-width="2" stroke-dasharray="38 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      </circle>

      <g fill="none" stroke="#4beeff" stroke-width="1.3" opacity="0.62">
        <ellipse rx="130" ry="34"/>
        <ellipse rx="122" ry="23" transform="rotate(18)"/>
        <ellipse rx="122" ry="23" transform="rotate(-18)"/>
      </g>

      <circle r="66" fill="url(#arcCore)" filter="url(#cyanGlow)">
        <animate attributeName="r" values="64;68;64" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M0-53L46-27V27L0 53L-46 27V-27Z" fill="#07131a" stroke="#e9feff" stroke-width="3"/>
      <path d="M0-42L36-21V21L0 42L-36 21V-21Z" fill="none" stroke="#35e9ff" stroke-width="2" opacity="0.8"/>
      <text x="0" y="4" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="3">JPL</text>
      <text x="0" y="25" fill="#8ff7ff" font-family="Consolas, monospace" font-size="9" text-anchor="middle" letter-spacing="2">CORE 100%</text>

      <g font-family="Consolas, monospace" font-size="9" letter-spacing="2" text-anchor="middle">
        <text y="-178" fill="#f1c762">IRON HUD</text>
        <text y="188" fill="#53edff">J.A.R.V.I.S. ONLINE</text>
      </g>
    </g>

    <!-- Animated holographic scanner -->
    <rect x="0" y="0" width="1200" height="2" fill="#41eaff" opacity="0.28">
      <animate attributeName="y" values="10;408;10" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.34;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="#7e1419" stroke-width="3"/>
  <rect x="6" y="6" width="1188" height="408" rx="23" fill="none" stroke="#27dff7" stroke-width="1" stroke-opacity="0.42"/>
</svg>
