<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-label="Animated capability radar: AI agents, full-stack, data, embedded, and computer vision loadout">
  <defs>
    <linearGradient id="rTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#2be7ff"/>
    </linearGradient>
    <radialGradient id="rFill" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#2be7ff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#0b8fae" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b6688" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="rGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="260" y="22" fill="url(#rTitle)" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">SUIT LOADOUT // CAPABILITY RADAR</text>

  <g transform="translate(260 178)">
    <!-- concentric pentagon grid -->
    <g fill="none" stroke="#123342" stroke-width="1">
      <path d="M0-27.5L26.2-8.5L16.2 22.3L-16.2 22.3L-26.2-8.5Z"/>
      <path d="M0-55L52.3-17L32.3 44.5L-32.3 44.5L-52.3-17Z"/>
      <path d="M0-82.5L78.5-25.5L48.5 66.7L-48.5 66.7L-78.5-25.5Z"/>
      <path d="M0-110L104.6-34L64.7 89L-64.7 89L-104.6-34Z" stroke="#1c5468" stroke-width="1.4"/>
    </g>
    <g stroke="#123342" stroke-width="1">
      <path d="M0 0L0-110M0 0L104.6-34M0 0L64.7 89M0 0L-64.7 89M0 0L-104.6-34"/>
    </g>

    <!-- rotating radar sweep -->
    <g opacity="0.30">
      <path d="M0 0V-104A104 104 0 0 1 52-90Z" fill="#32e9ff"/>
      <path d="M0 0V-104" stroke="#b9fbff" stroke-width="1.6" filter="url(#rGlow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- capability polygon locks in on load, then breathes -->
    <g transform="scale(0.001)">
      <animateTransform attributeName="transform" type="scale" from="0.001" to="1" dur="1.4s" begin="0.4s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.025;1" dur="3.4s" begin="2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
        <path d="M0-101.2L87.9-28.6L46.6 64.1L-38.8 53.4L-81.6-26.5Z" fill="url(#rFill)" stroke="#5df2ff" stroke-width="2" stroke-linejoin="round" filter="url(#rGlow)"/>
      </g>
    </g>

    <!-- vertex beacons -->
    <g fill="#5fffea" filter="url(#rGlow)">
      <circle cx="0" cy="-101.2" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.8s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/></circle>
      <circle cx="87.9" cy="-28.6" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="2.28s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/></circle>
      <circle cx="46.6" cy="64.1" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="2.76s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/></circle>
      <circle cx="-38.8" cy="53.4" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="3.24s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/></circle>
      <circle cx="-81.6" cy="-26.5" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="3.72s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/></circle>
    </g>

    <circle r="4" fill="#0a1720" stroke="#5df2ff" stroke-width="1.6" filter="url(#rGlow)"/>

    <!-- axis labels -->
    <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">
      <text x="0" y="-124" fill="#8af6ff" text-anchor="middle">AI AGENTS</text>
      <text x="0" y="-112" fill="#3d7c8c" text-anchor="middle" font-size="9">92%</text>
      <text x="116" y="-36" fill="#f8d77b">FULL-STACK</text>
      <text x="116" y="-24" fill="#7a6a3e" font-size="9">84%</text>
      <text x="76" y="104" fill="#8af6ff">DATA LAB</text>
      <text x="76" y="116" fill="#3d7c8c" font-size="9">72%</text>
      <text x="-76" y="104" fill="#f8d77b" text-anchor="end">EMBEDDED</text>
      <text x="-76" y="116" fill="#7a6a3e" text-anchor="end" font-size="9">60%</text>
      <text x="-116" y="-36" fill="#8af6ff" text-anchor="end">VISION HUD</text>
      <text x="-116" y="-24" fill="#3d7c8c" text-anchor="end" font-size="9">78%</text>
    </g>
  </g>

  <text x="260" y="322" fill="#3d7c8c" font-family="Consolas, monospace" font-size="9" letter-spacing="2" text-anchor="middle">CALIBRATED BY J.A.R.V.I.S. · SELF-ASSESSED FOCUS LEVELS</text>
</svg>
