<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="AI DOCUMENT ANALYSIS mission card">
  <defs>
    <linearGradient id="edge0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2be7ff"/>
      <stop offset="1" stop-color="#2be7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g0" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip0"><path d="M6 6H526L554 34V144H6Z"/></clipPath>
  </defs>

  <path d="M6 6H526L554 34V144H6Z" fill="#06141d" stroke="#164758" stroke-width="1.6"/>
  <path d="M6 6H526L554 34" fill="none" stroke="url(#edge0)" stroke-width="2.6"/>
  <path d="M6 144V120" stroke="#2be7ff" stroke-width="2.6" stroke-linecap="round"/>

  <g clip-path="url(#clip0)">
    <rect x="0" y="0" width="560" height="2" fill="#2be7ff" opacity="0.16">
      <animate attributeName="y" values="6;144;6" dur="9s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas, monospace">
    <text x="28" y="34" fill="#3d7c8c" font-size="9" font-weight="700" letter-spacing="2">MK-01 // MISSION</text>
    <circle cx="512" cy="29" r="4" fill="#2be7ff" filter="url(#g0)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="62" fill="#5fffea" font-size="19" font-weight="700" letter-spacing="1.1">AI DOCUMENT ANALYSIS</text>
    <text x="28" y="88" fill="#d8fbff" font-size="12" opacity="0.86">Intelligent document analysis and</text>
    <text x="28" y="106" fill="#d8fbff" font-size="12" opacity="0.86">structured data extraction workflow</text>
  </g>

  <g font-family="Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
    <rect x="28" y="116" width="80.0" height="19" rx="3" fill="#0a1f29" stroke="#2be7ff" stroke-width="1" opacity="0.9"/>
    <text x="35" y="129" fill="#5fffea" opacity="0.95">TypeScript</text>
    <rect x="116.0" y="116" width="27.2" height="19" rx="3" fill="#0a1f29" stroke="#2be7ff" stroke-width="1" opacity="0.9"/>
    <text x="123.0" y="129" fill="#5fffea" opacity="0.95">AI</text>
  </g>

  <path d="M28 130H532" stroke="#123342" stroke-width="1.2"/>
  <path d="M28 130H532" stroke="#2be7ff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="30 474" opacity="0.85" filter="url(#g0)">
    <animate attributeName="stroke-dashoffset" values="504;0" dur="6s" repeatCount="indefinite"/>
  </path>
