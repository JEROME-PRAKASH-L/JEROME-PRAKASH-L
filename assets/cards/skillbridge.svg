<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="SKILLBRIDGE LOCAL mission card">
  <defs>
    <linearGradient id="edge1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </linearGradient>
    <filter id="g1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip1"><path d="M6 6H526L554 34V144H6Z"/></clipPath>
  </defs>

  <path d="M6 6H526L554 34V144H6Z" fill="#06141d" stroke="#164758" stroke-width="1.6"/>
  <path d="M6 6H526L554 34" fill="none" stroke="url(#edge1)" stroke-width="2.6"/>
  <path d="M6 144V120" stroke="#f6c453" stroke-width="2.6" stroke-linecap="round"/>

  <g clip-path="url(#clip1)">
    <rect x="0" y="0" width="560" height="2" fill="#f6c453" opacity="0.16">
      <animate attributeName="y" values="6;144;6" dur="9s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas, monospace">
    <text x="28" y="34" fill="#3d7c8c" font-size="9" font-weight="700" letter-spacing="2">MK-02 // MISSION</text>
    <circle cx="512" cy="29" r="4" fill="#f6c453" filter="url(#g1)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.82s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="62" fill="#ffe9a6" font-size="19" font-weight="700" letter-spacing="1.1">SKILLBRIDGE LOCAL</text>
    <text x="28" y="88" fill="#d8fbff" font-size="12" opacity="0.86">Marketplace connecting local businesses</text>
    <text x="28" y="106" fill="#d8fbff" font-size="12" opacity="0.86">with students for scoped micro-tasks</text>
  </g>

  <g font-family="Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
    <rect x="28" y="116" width="60.2" height="19" rx="3" fill="#0a1f29" stroke="#f6c453" stroke-width="1" opacity="0.9"/>
    <text x="35" y="129" fill="#ffe9a6" opacity="0.95">Next.js</text>
    <rect x="96.19999999999999" y="116" width="66.8" height="19" rx="3" fill="#0a1f29" stroke="#f6c453" stroke-width="1" opacity="0.9"/>
    <text x="103.19999999999999" y="129" fill="#ffe9a6" opacity="0.95">Supabase</text>
    <rect x="171.0" y="116" width="40.4" height="19" rx="3" fill="#0a1f29" stroke="#f6c453" stroke-width="1" opacity="0.9"/>
    <text x="178.0" y="129" fill="#ffe9a6" opacity="0.95">LIVE</text>
  </g>

  <path d="M28 130H532" stroke="#123342" stroke-width="1.2"/>
  <path d="M28 130H532" stroke="#f6c453" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="30 474" opacity="0.85" filter="url(#g1)">
    <animate attributeName="stroke-dashoffset" values="504;0" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
