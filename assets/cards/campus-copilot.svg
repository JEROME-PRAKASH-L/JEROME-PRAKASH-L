<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="AI CAMPUS COPILOT mission card">
  <defs>
    <linearGradient id="edge3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </linearGradient>
    <filter id="g3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip3"><path d="M6 6H526L554 34V144H6Z"/></clipPath>
  </defs>

  <path d="M6 6H526L554 34V144H6Z" fill="#06141d" stroke="#164758" stroke-width="1.6"/>
  <path d="M6 6H526L554 34" fill="none" stroke="url(#edge3)" stroke-width="2.6"/>
  <path d="M6 144V120" stroke="#f6c453" stroke-width="2.6" stroke-linecap="round"/>

  <g clip-path="url(#clip3)">
    <rect x="0" y="0" width="560" height="2" fill="#f6c453" opacity="0.16">
      <animate attributeName="y" values="6;144;6" dur="9s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas, monospace">
    <text x="28" y="34" fill="#3d7c8c" font-size="9" font-weight="700" letter-spacing="2">MK-04 // MISSION</text>
    <circle cx="512" cy="29" r="4" fill="#f6c453" filter="url(#g3)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.26s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="62" fill="#ffe9a6" font-size="19" font-weight="700" letter-spacing="1.1">AI CAMPUS COPILOT</text>
    <text x="28" y="88" fill="#d8fbff" font-size="12" opacity="0.86">Campus AI assistant covering student</text>
    <text x="28" y="106" fill="#d8fbff" font-size="12" opacity="0.86">workflows and academic support</text>
  </g>

  <g font-family="Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
    <rect x="28" y="116" width="27.2" height="19" rx="3" fill="#0a1f29" stroke="#f6c453" stroke-width="1" opacity="0.9"/>
    <text x="35" y="129" fill="#ffe9a6" opacity="0.95">AI</text>
    <rect x="63.2" y="116" width="53.6" height="19" rx="3" fill="#0a1f29" stroke="#f6c453" stroke-width="1" opacity="0.9"/>
    <text x="70.2" y="129" fill="#ffe9a6" opacity="0.95">Python</text>
  </g>

  <path d="M28 130H532" stroke="#123342" stroke-width="1.2"/>
  <path d="M28 130H532" stroke="#f6c453" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="30 474" opacity="0.85" filter="url(#g3)">
    <animate attributeName="stroke-dashoffset" values="504;0" dur="6s" repeatCount="indefinite"/>
  </path>
